<div class="board-main-layout">
  <div class="player-top">
    <div class="player-row-component">
      <app-player-layout 
        playerName="Player 2" 
        [isBottom]="false"
        [capturedPieces]="board.blackCaptures()">
      </app-player-layout>
    </div>
  </div>
  
  <app-board-component #board></app-board-component>
  
  <div class="player-bottom">
    <div class="player-row-component">
      <app-player-layout 
        playerName="You" 
        [isBottom]="true"
        [capturedPieces]="board.whiteCaptures()">
        </app-player-layout>
    </div>
  </div>
  
</div>

<div class="sidebar">
  <div>
    <app-notations-component #notations [boardReference] = "board"></app-notations-component>
    <div>
      <button class="restart-btn" (click)="board.resetBoard()">Reset Board</button>
    </div>
  </div>
</div>
